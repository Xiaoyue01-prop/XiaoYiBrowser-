name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0

      - name: Generate verified Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gradle-wrapper-bootstrap"
          cd "$RUNNER_TEMP/gradle-wrapper-bootstrap"
          touch build.gradle
          gradle --no-daemon wrapper --gradle-version 9.7.0 --distribution-type bin
          install -D -m 0755 gradlew "$GITHUB_WORKSPACE/gradlew"
          install -D -m 0644 gradlew.bat "$GITHUB_WORKSPACE/gradlew.bat"
          install -D -m 0644 gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar"
          install -D -m 0644 gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.properties"
          printf '\ndistributionSha256Sum=84fbba45c7f4c64abc77460e1c00f541e9f960e3c7ed2538f1ede19eacd873ae\n' >> "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.properties"

      - name: Verify Gradle Wrapper
        run: ./gradlew --version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore Summit debug signing key if configured
        env:
          SUMMIT_DEBUG_KEYSTORE_BASE64: ${{ secrets.SUMMIT_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -n "$SUMMIT_DEBUG_KEYSTORE_BASE64" ]]; then
            install -d -m 0700 "$HOME/.android"
            umask 077
            printf '%s' "$SUMMIT_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi

      - name: Restore Summit release signing key if configured
        env:
          SUMMIT_RELEASE_KEYSTORE_BASE64: ${{ secrets.SUMMIT_RELEASE_KEYSTORE_BASE64 }}
          SUMMIT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SUMMIT_RELEASE_KEYSTORE_PASSWORD }}
          SUMMIT_RELEASE_KEY_ALIAS: ${{ secrets.SUMMIT_RELEASE_KEY_ALIAS }}
          SUMMIT_RELEASE_KEY_PASSWORD: ${{ secrets.SUMMIT_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SUMMIT_RELEASE_KEYSTORE_BASE64//[[:space:]]/}" &&
                -n "${SUMMIT_RELEASE_KEYSTORE_PASSWORD//[[:space:]]/}" &&
                -n "${SUMMIT_RELEASE_KEY_ALIAS//[[:space:]]/}" &&
                -n "${SUMMIT_RELEASE_KEY_PASSWORD//[[:space:]]/}" ]]; then
            umask 077
            signing_dir="$(mktemp -d "$RUNNER_TEMP/summit-release.XXXXXX")"
            printf '%s' "$SUMMIT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.keystore"
            printf 'SUMMIT_RELEASE_KEYSTORE_PATH=%s\n' "$signing_dir/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Run Summit Security Eval
        run: |
          bash security-eval/run.sh
          python3 security-eval/PhaseOnePolicyTest.py
          python3 security-eval/PhaseTwoAPolicyTest.py

      - name: Build debug APK and run Android lint
        env:
          SUMMIT_GOOGLE_WEB_CLIENT_ID: ${{ vars.SUMMIT_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest lintDebug

      - name: Build trial APK
        env:
          SUMMIT_GOOGLE_WEB_CLIENT_ID: ${{ vars.SUMMIT_GOOGLE_WEB_CLIENT_ID }}
          SUMMIT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SUMMIT_RELEASE_KEYSTORE_PASSWORD }}
          SUMMIT_RELEASE_KEY_ALIAS: ${{ secrets.SUMMIT_RELEASE_KEY_ALIAS }}
          SUMMIT_RELEASE_KEY_PASSWORD: ${{ secrets.SUMMIT_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Print Google sign-in config (public values only)
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          echo "== Package =="
          "$bt/aapt2" dump badging "$apk" | grep -m1 "^package:" || true
          echo "== Web Client ID packaged in APK =="
          "$bt/aapt2" dump resources "$apk" | grep -A2 "string/google_web_client_id" || echo "NOT FOUND"
          echo "== Signing certificate SHA-1 =="
          "$bt/apksigner" verify --print-certs "$apk" | grep -i "SHA-1" || true

      - name: Verify packaged Edge script
        shell: bash
        run: |
          set -euo pipefail
          node tools/edge-release/minify.cjs app/src/main/assets/edge_script.js "$RUNNER_TEMP/edge-release.js"
          apk=app/build/outputs/apk/release/app-release.apk
          unzip -p "$apk" assets/edge_script.js | cmp - "$RUNNER_TEMP/edge-release.js"
          if cmp -s "$RUNNER_TEMP/edge-release.js" app/src/main/assets/edge_script.js; then exit 1; fi

      - name: Upload trial APK
        uses: actions/upload-artifact@v4
        with:
          name: Summit-Trial-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
