<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com">
<title>Trang chủ</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<main>
  <img id="cat" src="summit_cat.webp" alt="" draggable="false">
  <svg id="clock" viewBox="0 0 400 142" role="img" aria-label="Đồng hồ"><text id="clockText" x="0" y="0"></text></svg>
  <p id="greeting"></p>

  <section id="weather" hidden>
    <button id="wHead" type="button" aria-expanded="false">
      <span id="wIcon" aria-hidden="true">📍</span>
      <span id="wTemp"></span>
      <span id="wText">
        <span id="wDesc"></span>
        <span id="wSub"></span>
      </span>
      <span id="wChevron" aria-hidden="true">▾</span>
    </button>
    <div id="wDetail" hidden>
     <div id="wInner">
      <div id="wHours"></div>
      <div id="wDays"></div>
      <button id="wChange" type="button">📍 Đổi thành phố</button>
      <div id="wPicker" hidden>
        <input id="wQuery" type="search" placeholder="Tìm thành phố…" autocomplete="off" autocapitalize="words" enterkeyhint="search">
        <div id="wResults"></div>
      </div>
     </div>
    </div>
  </section>
</main>
<script src="home.js"></script>
</body>
</html>
